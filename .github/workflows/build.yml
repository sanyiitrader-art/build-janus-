name: Build Project Janus

# Runs on every push and pull request so compile errors surface immediately
# without needing Android Studio installed locally.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ---------------------------------------------------------------
      # Generate the Gradle wrapper (gradlew, gradlew.bat, and the
      # wrapper jar) ourselves, using a GitHub-hosted Gradle install.
      # This means you never have to source gradle-wrapper.jar (a binary
      # file) by hand — CI produces it fresh every run, pinned to the
      # exact Gradle version this project requires (8.7, matching AGP
      # 8.5.2 / Kotlin 2.0.20 per the version-compatibility notes in the
      # root build.gradle.kts). Safe to run even if a wrapper already
      # exists in the repo — it will just overwrite it identically.
      # ---------------------------------------------------------------
      - name: Set up Gradle (for wrapper generation)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (coordmapping + app)
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: janus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error