# Project-wide Gradle settings for Project Janus

# JVM args for the Gradle daemon — bump heap since Compose compilation is memory-hungry
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Run independent modules' tasks in parallel (app / coordmapping / targetserver)
org.gradle.parallel=true

# Enable Gradle's build cache for faster incremental builds
org.gradle.caching=true

# Use AndroidX (required — this project has no support-library dependencies)
android.useAndroidX=true

# Disable Jetifier: not needed since nothing here depends on legacy support-library artifacts
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes: faster builds, avoids resource id leakage between modules
android.nonTransitiveRClass=true
